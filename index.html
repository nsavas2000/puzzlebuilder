<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f2f5fb">
  <title>Ahşap Puzzle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>Ankara Robotik <em>Ahşap Puzzle</em></h1>
      <div class="progress">
        <span id="count">Yükleniyor...</span>
        <div class="bar"><i id="bar"></i></div>
        <button id="restart" class="ghost-btn" type="button" title="Baştan başla">↺ Baştan</button>
      </div>
    </header>

    <div class="layout">
      <!-- Sol: parça listesi (yukarıdan aşağı) -->
      <aside class="panel">
        <div class="panel-head">
          <h2>Parçalar</h2>
          <span id="left"></span>
        </div>
        <div id="pieceList"></div>
      </aside>

      <!-- Sağ: model -->
      <section class="viewer">
        <div id="stage"></div>

        <div class="tools">
          <div class="cube-wrap" id="cubeWrap" title="Sürükleyerek modeli çevir, yüzüne tıklayarak o görünüme geç">
            <div id="cube">
              <div class="f front"  data-view="front">ÖN</div>
              <div class="f back"   data-view="back">ARKA</div>
              <div class="f right"  data-view="right">SAĞ</div>
              <div class="f left"   data-view="left">SOL</div>
              <div class="f top"    data-view="top">ÜST</div>
              <div class="f bottom" data-view="bottom">ALT</div>
            </div>
          </div>

          <button class="tool" id="btnHome" type="button" title="Başlangıç görünümü">
            <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h5v-5.5h3v5.5h5V10"/></svg>
          </button>
          <button class="tool" id="btnFit" type="button" title="Modele sığdır">
            <svg viewBox="0 0 24 24"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/><path d="M12 8.2 15.8 12 12 15.8 8.2 12z"/></svg>
          </button>
          <button class="tool" id="btnIn" type="button" title="Yakınlaştır">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="tool" id="btnOut" type="button" title="Uzaklaştır">
            <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
          </button>
          <button class="tool" id="btnProj" type="button" title="Perspektif / Ortografik görünüm">
            <svg viewBox="0 0 24 24"><path d="M12 3.2 19.8 7.6v8.8L12 20.8l-7.8-4.4V7.6z"/><path d="M12 12 19.8 7.6M12 12v8.8M12 12 4.2 7.6"/></svg>
          </button>
        </div>

        <div id="hint">Parçayı sürükleyerek çevir • Tıklayınca yerine oturur</div>

        <div id="toast">
          <span>Harika! Modeli tamamladın! 🎉</span>
          <button id="again" type="button">Tekrar oyna</button>
        </div>
      </section>
    </div>
  </div>

  <div id="rotate" role="alert">
    <div class="phone"></div>
    <p>Lütfen telefonunu yatay çevir</p>
    <small>Oyun yatay modda oynanır</small>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
